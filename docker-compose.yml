version: '3.8'\n\nservices:\n  # PostgreSQL + TimescaleDB\n  db:\n    image: timescale/timescaledb:latest-pg15\n    container_name: sap-monitor-db\n    environment:\n      POSTGRES_DB: sap_monitor\n      POSTGRES_USER: postgres\n      POSTGRES_PASSWORD: postgres\n      PGDATA: /var/lib/postgresql/data/pgdata\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql\n    ports:\n      - \"5432:5432\"\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - sap-monitor-network\n\n  # Redis Cache\n  redis:\n    image: redis:7-alpine\n    container_name: sap-monitor-redis\n    command: redis-server --appendonly yes\n    volumes:\n      - redis_data:/data\n    ports:\n      - \"6379:6379\"\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n    networks:\n      - sap-monitor-network\n\n  # Ollama AI Engine\n  ollama:\n    image: ollama/ollama:latest\n    container_name: sap-monitor-ollama\n    environment:\n      OLLAMA_HOST: 0.0.0.0:11434\n    volumes:\n      - ollama_data:/root/.ollama\n    ports:\n      - \"11434:11434\"\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:11434/api/tags\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n    networks:\n      - sap-monitor-network\n\n  # FastAPI Backend\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: sap-monitor-backend\n    environment:\n      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/sap_monitor\n      REDIS_URL: redis://redis:6379/0\n      OLLAMA_URL: http://ollama:11434\n      SECRET_KEY: your-super-secret-key-change-this\n      JWT_EXPIRATION_HOURS: 24\n      DEBUG: \"false\"\n      LOG_LEVEL: INFO\n    ports:\n      - \"8000:8000\"\n    depends_on:\n      db:\n        condition: service_healthy\n      redis:\n        condition: service_healthy\n    volumes:\n      - ./backend:/app\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8000/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 40s\n    networks:\n      - sap-monitor-network\n\n  # React Frontend\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: sap-monitor-frontend\n    environment:\n      REACT_APP_API_URL: http://localhost:8000\n      REACT_APP_WS_URL: ws://localhost:8000\n    ports:\n      - \"3000:3000\"\n    depends_on:\n      - backend\n    volumes:\n      - ./frontend/src:/app/src\n      - ./frontend/public:/app/public\n    networks:\n      - sap-monitor-network\n\nvolumes:\n  postgres_data:\n    driver: local\n  redis_data:\n    driver: local\n  ollama_data:\n    driver: local\n\nnetworks:\n  sap-monitor-network:\n    driver: bridge\n